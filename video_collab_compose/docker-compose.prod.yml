version: "3.8"

services:
  db:
    image: postgres:13.2-alpine
    restart: always
    volumes:
      - video_collab_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - 5432:5432
  app:
    build: .
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.backend=flask"
      - "traefik.frontend.rule=${TRAEFIK_FRONTEND_RULE}"


  traefik:
    image: traefik:v1.7
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.toml:/etc/traefik/traefik.toml:ro
      - ./traefik/acme:/etc/traefik/acme
    ports:
     - "80:80"
     - "443:443"
     #- "8080:8080"


volumes:
  video_collab_data:
    external: true
