version: "3.8"

services:
  db:
    image: postgres:13.2-alpine
    restart: always
    volumes:
      - video_collab_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD:${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
  app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  video_collab_data:
    external: true
