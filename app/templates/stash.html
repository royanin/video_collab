<script type="text/javascript" charset="utf-8">
         // Code to load the IFrame player API code asynchronously
         var tag = document.createElement('script');
         var startTime = 100;

         tag.src = "https://developers.panopto.com/scripts/embedapi.min.js"
         var firstScriptTag = document.getElementsByTagName('script')[0];
         firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

          // The following function creates an <iframe> and Panopto player

         var embedApi;
         function onPanoptoEmbedApiReady()
         {
             embedApi = new EmbedApi("player", {
                 width: "750",
                 height: "422",
                 //This is the URL of your Panopto site
                 serverName: "mit.hosted.panopto.com",
                 //sessionId: "d95ddfd0-9218-48ca-93fe-ac830148c168",
                 sessionId:"b987cb43-22f6-43ed-91f6-ac770149bc6e",
                 videoParams: { // Optional parameters
                 //interactivity parameter controls if the user sees table of contents, discussions, notes, & in-video search
                     "interactivity": "search",
                     "showtitle": "false",
                     "hideoverlay":"false"
                 },
                 events: {
                     "onIframeReady": onPanoptoIframeReady,
                     "onReady": onPanoptoVideoReady,
                     "onStateChange": onPanoptoStateUpdate
                 }
             });
         }

           //The API will call this function when the iframe is ready
         function onPanoptoIframeReady()
         {
             // The iframe is ready and the video is not yet loaded (on the splash screen)
             // Load video will begin playback
             embedApi.loadVideo();

             //consol.log(vidDur);
             $('#totaltime').val(vidDur);
             //document.getElementById("#totaltime").innerHTML=vidDur;

         }

           //The API will call this function when the video player is ready
         function onPanoptoVideoReady()
         {
             // The video has successfully been loaded by onPanoptoIframeReady

             // Seek to 100s
             embedApi.seekTo(startTime);
             //loopFunc();
         }

         //The API calls this function when a player state change happens
          function onPanoptoStateUpdate(state)
         {
             if (state === PlayerState.Playing)
             {
                 embedApi.setVolume(0.3);
                 //embedApi.setPlaybackRate(2);
                 document.getElementById("tmon").innerHTML = embedApi.getCurrentTime()
             }
             document.getElementById("myText").innerHTML = embedApi.getState();
         }
         function onPlaybackRateChange()
         {
            document.getElementById("myTextr").innerHTML = embedApi.getPlaybackRate();
         }
         //console.log('before');
         function myFunction() {

           document.getElementById("myText3").innerHTML = embedApi.getCurrentTime();
           document.getElementById("myText4").innerHTML = embedApi.getPlaybackRate();

           //document.getElementById("myText").innerHTML = onStateChange();
         }

         function playPause(){

           var plst = embedApi.getState();
           if (plst==1)
            embedApi.pauseVideo();
            //var pause_button = document.getElementById("myText").innerHTML
          else
            embedApi.playVideo();

                };

         }
         //SocketIO segment
         var socket;
         $(document).ready(function(){
             socket = io.connect('http://' + document.domain + ':' + location.port + '/chat');
             socket.on('connect', function() {
                 socket.emit('joined', {});
             });
             socket.on('status', function(data) {
                 $('#chat').val($('#chat').val() + '<' + data.msg + '>\n');
                 $('#chat').scrollTop($('#chat')[0].scrollHeight);
             });
             socket.on('message', function(data) {
                 $('#chat').val($('#chat').val() + data.msg + '\n');
                 $('#chat').scrollTop($('#chat')[0].scrollHeight);
             });
             $('#text').keypress(function(e) {
                 var code = e.keyCode || e.which;
                 if (code == 13) {
                     text = $('#text').val();
                     $('#text').val('');
                     socket.emit('text', {msg: text});
                 }
             });

             $("#slider1").on("input", function() {
                 //$("#input_B").val(this.value);
                 socket.emit('value changed', {who: $(this).attr('id'), data: $(this).val()});

             });
             socket.on('update value', function(msg) {
                 $('input#'+msg.who).val(msg.data)
             });

             //Play pause events
             $("#pp1").on("click", function() {
                 //$("#input_B").val(this.value);
                 //var ps = embedApi.getState();
                 socket.emit('plps', {who: $(this).attr('id')});

             });

             socket.on('update plps', function(msg) {
                 //$('#pp1'+msg.who).val(msg.data)
                 //msg.data;
                 playPause();

             });

         });

         function emitSpeedChange(){
           var x = $('#pbspeed').val();
           socket.emit('pbspeed', {who: 'pbspeed', data: x});
         }

         function leave_room() {
             socket.emit('left', {}, function() {
                 socket.disconnect();

                 // go back to the login page
                 window.location.href = "{{ url_for('main.index') }}";
             });
         }
