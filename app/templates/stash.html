<script type="text/javascript" charset="utf-8">
  //Function to load chat and format it based on the clientname:
  function loadChat(data, add_pos){
      //data is a single message in the json format containing who, when and msg as keys
      //add_pos could be "append" or "prepend"
      var options = { month: 'short', day: 'numeric' };
      var dateGiven = new Date(1000*data.when).toLocaleDateString(options);
      var dateNow = new Date().toLocaleDateString(options);
      var timeNow = new Date(1000*data.when).toLocaleTimeString();
      if (dateGiven!==dateNow){
          timeNow = dateGiven+', '+timeNow;
      }

      var user = {{ session.name|tojson }};

      if (data.who==user){
        //$('#chat').append(posting_format)
        var who = "";
        var posting_format = '<span class="tstamp" style="visibility:hidden">'+data.when+'</span>\
        <div class="container"><div class="row">\
          <div class="col-11"><div class="msgOut">'+data.msg+'</div>\
          <div class="msgOut whoTimeOut">'+who+timeNow+'</div>\
          <div class="col-1"></div></div></div></div>';

      }
      else {
        var who=data.who+'  |  ';
        var userNn = who.substring(0, 2);
        //$('#chat').append(posting_format)
        var posting_format = '<span class="tstamp" style="visibility:hidden">'+data.when+'</span>\
        <div class="container"><div class="row no-gutters">\
          <div class="col-2 text-right"><span class="iconIn">'+userNn+'</span></div>\
          <div class="col-10"><div class="msgIn">'+data.msg+'</div>\
          <div class="msgIn whoTimeOut">'+who+timeNow+'</div></div></div></div>';
      }

      if (add_pos==="append"){
        $('#chat').append(posting_format);
      }
      else {
        $('#chat').prepend(posting_format);
      }
      /* Decide whether to append or prepend */

  }

  function getMoreChat(){
      var tstamp = $('.tstamp').eq(0).html();
      //alert(tstamp);
      //data = {'tstamp': tstamp}
      if (!tstamp){
        data = JSON.stringify({'tstamp': new Date().getTime()/1000.0});
      }
      else{
        data = JSON.stringify({'tstamp': tstamp});
      }

     $.ajax({
       url: "{{ url_for('main.getchat') }}",
       data: data,
       type: 'POST',
        contentType: "application/json",
        dataType: 'json',
       success: function(response){
         //console.log(response.length);
          //destroy button
          var loadChatButtonId =  "loadchatButton";
          var buttonLoadChat = document.getElementById(loadChatButtonId);
          //var buttonLoadChatClass = ('#loadchatButton').attr('class');
          var buttonLoadChatText = buttonLoadChat.innerHTML;
          //alert(buttonLoadChatClass);
          buttonLoadChat.remove();

          //Prepend returned chat messages
          for (var i = 0; i < response.length; i++){
             //console.log(response[i])
             loadChat(response[i], "prepend")
          }

          //prepend a new loadchatButton:
          const newLoadChat = document.createElement("button");
          newLoadChat.setAttribute("id", loadChatButtonId);
          newLoadChat.onclick = getMoreChat; //setting it as getMoreChat() calls the function with infinite loop...
          //newLoadChat.ClassName = buttonLoadChatClass;
          newLoadChat.textContent = buttonLoadChatText;
          $('#chat').prepend(newLoadChat);
       },
       error: function(error){
         console.log(error);
       }
     });
    }
    socket.on('message', function(data) {

      loadChat(data, "append");

    });
    $('#text').keypress(function(e) {
        var code = e.keyCode || e.which;
        if (code == 13) {
            text = $('#text').val()+ '\n';
            if (text!='\n'){
              text = sanitizeText(text);
              $('#text').val('');
              socket.emit('text', {msg: text});
          }
        }
    });

    function getSize(){
      var elem = document.getElementById("c");
      if(elem) {
         var rect = elem.getBoundingClientRect();
         //document.querySelector('#widthNum').textContent = rect.width;
         //document.querySelector('#heightNum').textContent = rect.height;
         var wVideo = rect.width;
         var hVideo = rect.height - 100;

         document.querySelector('#widthNum').textContent = wVideo;
         document.querySelector('#heightNum').textContent = hVideo;
         /*
         if(embedApi){
          embedApi.setSize(width=wVideo, height=hVideo);
        }*/

      }
    }


</script>
