<!DOCTYPE html>
<html lang="en-US">
<head>
    {% block head %}
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta %}{% endblock %}">
    <meta name="author" content="">


    <title>{% block title %}{% endblock %} </title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css" integrity="sha384-9gVQ4dYFwwWSjIDZnLEWnxCjeSWFphJiwGPXr1jddIhOegiu1FwO5qRGvFXOdJZ4" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.css" integrity="sha512-aOG0c6nPNzGk+5zjwyJaoRUgCdOrfSDhmMID2u4+OIslr0GjpLKo7Xm0Ao3xmpM4T8AmIouRkqwj1nrdVsLKEQ==" crossorigin="anonymous" />
    <!-- <link rel="stylesheet" type="text/css" media="screen" href="https://cdn.conversejs.org/7.0.4/dist/converse.min.css">-->
    <!-- Include Quill stylesheet -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!--<link href="/static/css/converse.min.css" rel="stylesheet">-->
    <link href="/static/css/custom.css" rel="stylesheet">
    <link href="/static/css/emojipanel.css" rel="stylesheet">
    <link rel=stylesheet href="//cdnjs.cloudflare.com/ajax/libs/KaTeX/0.7.1/katex.min.css" async
    defer>
    <link rel=stylesheet href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.12.0/styles/monokai-sublime.min.css" async
    defer>
    <style>
        ul.emoji-list * {
          -webkit-user-select: none;
          -moz-user-select: none;
          -ms-user-select: none;
          user-select: none;
        }
        ul.emoji-list li {
          font-size: 36px;
          float: left;
          display: inline-block;
          padding: 2px;
          margin: 4px;
        }
        img.emoji {
          cursor: pointer;
          height: 1em;
          width: 1em;
          margin: 0 .05em 0 .1em;
          vertical-align: -0.1em;
        }
        </style>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat&display=swap');
    </style>

    <script src="https://cdn.socket.io/socket.io-3.0.3.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js" integrity="sha512-bLT0Qm9VnAYZDflyKcBaQ2gg0hSYNQrJ8RilYldYQ1FxQYoCLtUjuuRuZo+fjqhx/qtq/1itJ0C2ejDxltZVFg==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js" integrity="sha512-uto9mlQzrs59VwILcLiRYeLKPPbS/bT71da/OEBYEwcdNUk8jYIy+D176RYoop1Da+f9mvkYrmj5MCLZWEtQuA==" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/strophe.js/1.2.16/strophe.min.js" integrity="sha512-+fXQU/UE6oz0727sBD/JhVeEGQFJVJersk/8lUhHY1heMW79ILCvkpH9bqTcRYgdutB80MCwT/nooxmjvnUsBQ==" crossorigin="anonymous"></script>

    <script src='https://meet.jit.si/external_api.js'></script>
    <script src="https://meet.jit.si/libs/lib-jitsi-meet.min.js"></script>
    <!--<script src="https://cdn.conversejs.org/7.0.4/dist/converse.min.js" charset="utf-8"></script>-->
    <!--<script src="/static/js/converse.min.js"></script>
    <script src="/static/js/emojis.js"></script>
    <script src="/static/js/shared-connection-worker.js"></script> -->
    <!-- Include the Quill library -->
    <script src="/static/js/quill.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.0/split.min.js"></script>
    <script src="/static/js/launchYjsEditor.js"></script>
    <script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js" crossorigin="anonymous"></script>
    <script src="/static/js/emojipanel.js" crossorigin="anonymous"></script>

    {% endblock %}
</head>
<body>
    <div id="content">{% block content %}{% endblock %}</div>
    <div id="footer">
      {% block footer %}
      <div class="container-fluid">
              <div  class="row">
                <div class="col-md-6">
                </div>
                <div class="col-md-6">
                </div>
              </div>
      </div>
      {% endblock %}
    </div>
  </body>
</html>
