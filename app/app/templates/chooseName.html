{% extends "html_header.html" %}
{% block meta %}
{% endblock %}
{% block title %}Welcome to VClab!{% endblock %}
{% block head %}
  {{ super() }}
{% endblock %}
{% block content %}
  <div class="container-fluid">
          <div class="row">
            {% include "side_panel_index.html" %}
            <!--<div class="col-md-6 offset-md-3"> -->
            <div class="col-md-6">
            <div  class="p-5 m-5">
              <p class="p-5 m-5"></p>
            <div id="chooseNameButton" class="input-group mb-3">
              <input type="text" id="username" class="form-control" placeholder='Screen name: 20 characters max'
              aria-label="Choose a name" aria-describedby="basic-addon2">
              <div class="input-group-append">
                <!--<small class="text-muted">Letters and numbers only, 6-20 characters (e.g., <em>hgttg42</em>)</small>-->
                <button class="btn btn-sm btn-outline-primary" onclick="gotoRoom()" type="button">Go!</button>
              {#
                  <div class="text-center" id="notif">{{ session['msg'] }}
               #}
              </div>
            </div>
            <!--<span><small>Load a video by URL. <em>Others will see it after you hit "Load"</em></small></span>-->
            <p><small>Entering room <span id="roomname">{{ session.room }}</span></small></p>
            </div>
            </div>
            </div>
    </div>
  </div>
<script  type="text/javascript" charset="utf-8">
  //Function to join a room:
  function gotoRoom(){
    roomname = $('#roomname').text();
    username = $('#username').val();
    //alert(roomname);
    if (username !== ''){
      $.ajax({
        url: "{{ url_for('main.joinRoom') }}",
        data: JSON.stringify({'room': roomname, 'name': username}),
        type: 'POST',
        contentType: "application/json",
        dataType: 'json',
        success: function(response){
          //$("#showName").load(" #showName");
          //document.getElementById("showName").innerHTML = 'Hello <strong>'+response['name']+'</strong>!<br>';
          //document.getElementById("notif").innerHTML = response['msg'];
          if (response['msg']=="Success!"){
            //console.log(response['url'])
            window.location = response['url'];
          }
          /*else {
            alert({{ session['msg'] }});
          }*/
        },
        error: function(error){
            document.getElementById("notif").innerHTML = "Something went wrong. Please try again!";
          }
        });
    }

  }
</script>

{% endblock %}
